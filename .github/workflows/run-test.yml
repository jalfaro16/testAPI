name: Ejecutar Pruebas de Postman con Newman

# El pipeline se disparará automáticamente cada vez que hagas un "git push" a la rama main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  automation-tests:
    # Le pedimos a GitHub que nos preste una máquina virtual con Ubuntu actualizado
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Clonar el código del repositorio dentro de la máquina virtual
      - name: Clonar repositorio
        uses: actions/checkout@v4

      # Paso 2: Instalar Node.js en la máquina virtual
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Paso 3: Instalar Newman de forma global en esa máquina virtual
      - name: Instalar Newman y HTML Extra Reporter
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      # Paso 4: Ejecutar Newman apuntando a los archivos del repositorio
      # Al estar en Linux (ubuntu), las rutas usan barras diagonales de la raíz del proyecto
      - name: Ejecutar Suite de API Tests
        run: |
         newman run Booker_API_Tests.postman_collection.json \
         -e QA_Enviorement.postman_environment.json \
         -r cli,htmlextra \
         --reporter-htmlextra-export newman-report.html

      - name: Subir reporte HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Newman-HTML-Report
          path: newman-report.html   