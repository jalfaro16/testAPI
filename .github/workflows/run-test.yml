name: Run Postman Tests with Newman

# Trigger the workflow on pushes, pull requests, or manual execution
on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

jobs:
  automation-tests:
    # Use the GitHub Environment where secrets and variables are stored
    environment: dev

    # Use the latest Ubuntu runner
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      # Step 3: Install Newman and HTML Extra Reporter
      - name: Install Newman and HTML Extra Reporter
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      # Step 4: Execute the Postman collection
      - name: Run API Test Suite
        run: |
          newman run Booker_API_Tests.postman_collection.json \
            -e QA_Enviorement.postman_environment.json \
            --env-var username="${{ secrets.BOOKER_USERNAME }}" \
            --env-var password="${{ secrets.BOOKER_PASSWORD }}" \
            --env-var base_url="${{ vars.BASE_URL }}" \
            -r cli,htmlextra,junit \
            --reporter-htmlextra-export newman-report.html \
            --reporter-junit-export newman-report.xml

      # Step 5: Upload reports even if the tests fail
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Newman-Reports
          path: |
            newman-report.html
            newman-report.xml